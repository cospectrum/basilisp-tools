[project]
name = "basilisp-tools"
description = "Formatting, checking, and language server tools for Basilisp"
version = "0.1.0"
dependencies = [
  "basilisp>=0.5.1",
  "opentelemetry-exporter-otlp>=1.45.0",
  "opentelemetry-exporter-otlp-json-http>=0.66b0",
  "opentelemetry-instrumentation-logging>=0.66b0",
  "pygls>=2.1.1,<3",
  "regex>=2026.9.29",
]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
]

[project.urls]
Homepage = "https://github.com/cospectrum/basilisp-tools"

[project.scripts]
blt = "basilisp_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = ["*.lpy"]

[dependency-groups]
dev = ["basilisp[pytest]>=0.5.1"]
