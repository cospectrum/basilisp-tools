name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        python: ["3.10", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Test
        run: nix develop --no-update-lock-file --command uv run --locked basilisp test -p tests --include-unsafe-path=false

  checks:
    name: Format, workflows, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Check formatting
        run: nix develop --no-update-lock-file --command uv run --locked blt format --check src tests
      - name: Check source
        run: nix develop --no-update-lock-file --command uv run --locked blt check --repro --no-python-inspection src
      - name: Check workflows
        run: nix develop --no-update-lock-file --command actionlint
      - name: Check real Python packages
        run: nix develop --no-update-lock-file --command uv run --locked --with numpy==2.5.3 --with requests==2.34.2 --with types-requests==2.33.0.20260906 --with pydantic==2.13.5 python scripts/check_python_packages.py --timeout 10
      - name: Exercise generated projects
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/check_generated_projects.py --output "$RUNNER_TEMP/blt-generated" --seeds 1 --workspace-files 12
      - name: Build distribution
        run: nix develop --no-update-lock-file --command uv build
      - name: Test installed wheel
        shell: bash
        run: |
          wheel="$(realpath dist/*.whl)"
          cd "$(mktemp -d)"
          nix develop --no-update-lock-file "$GITHUB_WORKSPACE" --command uv tool run --isolated --from "$wheel" blt --version
          printf '(let [x 1]\n  x)\n' | nix develop --no-update-lock-file "$GITHUB_WORKSPACE" --command uv tool run --isolated --from "$wheel" blt format --check -
          printf '(ns wheel-smoke (:import [math])) (math/sqrt 4)\n' | nix develop --no-update-lock-file "$GITHUB_WORKSPACE" --command uv tool run --isolated --from "$wheel" blt check --repro -
          nix develop --no-update-lock-file "$GITHUB_WORKSPACE" --command uv run --project "$GITHUB_WORKSPACE" --locked python "$GITHUB_WORKSPACE/scripts/smoke_lsp.py" uv tool run --isolated --from "$wheel" blt lsp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  public-projects:
    name: Validate public projects
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Fetch pinned public sources
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/fetch_public_projects.py "$RUNNER_TEMP/blt-public" --source-only --project basilisp-flask --project basilisp-nrepl-async --project calc
      - name: Check formatter preservation and idempotence
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/check_public_format.py --corpus "$RUNNER_TEMP/blt-public" --project basilisp-flask --project basilisp-nrepl-async --report "$RUNNER_TEMP/blt-public-reports/format.json"
      - name: Check public sources and retain diagnostics
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/check_public_check.py --corpus "$RUNNER_TEMP/blt-public" --project basilisp-flask --project basilisp-nrepl-async --no-python-inspection --output "$RUNNER_TEMP/blt-public-reports/check"
      - name: Exercise public LSP workspaces
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/check_public_lsp.py --corpus "$RUNNER_TEMP/blt-public" --project basilisp-flask --project basilisp-nrepl-async --request-timeout 180 --diagnostic-timeout 180 --output "$RUNNER_TEMP/blt-public-reports/lsp"
      - name: Run upstream calc tests before and after formatting
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/check_public_runtime.py --corpus "$RUNNER_TEMP/blt-public" --output "$RUNNER_TEMP/blt-public-reports/runtime"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-project-reports
          path: ${{ runner.temp }}/blt-public-reports/
          if-no-files-found: warn

  python-interop:
    name: Validate Python and ML interop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Install pinned CPU ML packages
        run: |
          nix develop --no-update-lock-file --command uv venv "$RUNNER_TEMP/blt-ml"
          nix develop --no-update-lock-file --command uv pip install --python "$RUNNER_TEMP/blt-ml/bin/python" --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          nix develop --no-update-lock-file --command uv pip install --python "$RUNNER_TEMP/blt-ml/bin/python" onnx==1.23.2 numpy==2.5.3 basilisp==0.5.1
      - name: Validate real ML programs and reviewed typing limits
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/check_ml_packages.py --python "$RUNNER_TEMP/blt-ml/bin/python" --baseline scripts/ml_typing_baseline.json --output "$RUNNER_TEMP/blt-python-reports/ml.json"
      - name: Exercise generated training and inference projects
        run: |
          nix develop --no-update-lock-file --command uv run --locked python scripts/generate_ml_projects.py --output "$RUNNER_TEMP/blt-ml-generated" --size 16
          nix develop --no-update-lock-file --command uv run --locked python scripts/check_ml_packages.py --python "$RUNNER_TEMP/blt-ml/bin/python" --manifest "$RUNNER_TEMP/blt-ml-generated/cases.json" --case-timeout 600 --output "$RUNNER_TEMP/blt-python-reports/generated.json"
      - name: Fetch and inventory pinned Python typing fixtures
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/check_python_typing.py --corpus "$RUNNER_TEMP/blt-typing" --provider typing --fetch --inventory-only --output "$RUNNER_TEMP/blt-python-reports/typing-inventory.json"
      - name: Compare upstream constructor and generic contracts
        run: |
          for fixture in dataclasses_kwonly dataclasses_transform_class dataclasses_transform_field generics_basic; do
            nix develop --no-update-lock-file --command uv run --locked python scripts/check_python_typing.py --corpus "$RUNNER_TEMP/blt-typing" --provider typing --fixture "$fixture.py" --require-resolved --output "$RUNNER_TEMP/blt-python-reports/$fixture.json"
          done
          nix develop --no-update-lock-file --command uv run --locked python - "$RUNNER_TEMP/blt-python-reports" <<'PY'
          import json
          import sys
          from pathlib import Path
          expected = {"dataclasses_kwonly": 17, "dataclasses_transform_class": 8,
                      "dataclasses_transform_field": 5, "generics_basic": 6}
          for name, count in expected.items():
              report = json.loads((Path(sys.argv[1]) / (name + ".json")).read_text())
              assert report["counts"].get("passed", 0) == count, (name, report["counts"])
              assert not any(report["counts"].get(key, 0) for key in ("unknown", "failed", "error")), (name, report["counts"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-interop-reports
          path: ${{ runner.temp }}/blt-python-reports/
          if-no-files-found: warn

  compatibility:
    name: Compare with upstream tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: weavejester/cljfmt
          ref: baab5008032945434cbca23ef5eda516e3ea97b0
          path: .cljfmt-reference
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: clojure-lsp/clojure-lsp
          ref: 8ad65c1d681d2fc9022b3854f6dcaf1677d29631
          path: .clojure-lsp-reference
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: clj-kondo/clj-kondo
          ref: 6267607412e55ed3b91710ef542f3fee2ad7aa05
          path: .clj-kondo-reference
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: basilisp-lang/basilisp
          ref: 2f993f9e53b4195316426140384c38728304341e
          path: .basilisp-reference
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Compare upstream cases and verify idempotence
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_cljfmt.py --cljfmt .cljfmt-reference --corpus .basilisp-reference --report cljfmt-upstream-report.json
      - name: Compare configuration precedence with Leiningen plugin
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_config.py --cljfmt .cljfmt-reference
      - name: Compare literal Leiningen profile merging
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_lein_profiles.py
      - name: Compare configuration regexes with Java Pattern
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_regex.py
      - name: Compare checker diagnostics with clj-kondo
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_kondo.py
      - name: Compare checker configuration with clj-kondo
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_kondo_config.py
      - name: Compare checker analysis and SARIF with clj-kondo
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_kondo_output.py
      - name: Compare restricted hooks with clj-kondo
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_hooks.py
      - name: Compare refactorings with clojure-lsp
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_lsp_refactors.py --clojure-lsp .clojure-lsp-reference
      - name: Compare language server configuration with clojure-lsp
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_lsp_config.py --clojure-lsp .clojure-lsp-reference
      - name: Audit upstream language server test assertions
        run: nix develop --no-update-lock-file --command uv run --locked python scripts/check_lsp_upstream.py --clojure-lsp .clojure-lsp-reference --baseline scripts/lsp_upstream_baseline.json --differences scripts/lsp_upstream_differences.json --report lsp-upstream-report.json
      - name: Audit upstream checker test inputs
        run: nix develop --no-update-lock-file .#compatibility --command uv run --locked python scripts/check_kondo_upstream.py --checkout .clj-kondo-reference --baseline scripts/kondo_upstream_baseline.json --differences scripts/kondo_upstream_differences.json --report kondo-upstream-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: upstream-test-reports
          path: '*-upstream-report.json'
          if-no-files-found: warn
